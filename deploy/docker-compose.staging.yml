services:
  api:
    image: ${API_IMAGE}
    container_name: staging-api
    restart: unless-stopped
    environment:
      PORT: 3000
      ORDERS_FILE: /app/data/orders.json
    expose:
      - "3000"
    volumes:
      - coffee-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - staging-network

  web:
    image: ${WEB_IMAGE}
    container_name: staging-web
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - staging-network

networks:
  staging-network:
    driver: bridge

volumes:
  coffee-data:
