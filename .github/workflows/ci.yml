name: Continuous Integration

on:
  push:
    branches:
      - "feature/**"
      - main
  # stage-backend pushes run this workflow through staging.yml (workflow_call),
  # so a failing check blocks the staging deploy and CI doesn't run twice.
  pull_request:
    branches:
      - main
      - stage-backend
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Lint shell scripts
        # shellcheck is preinstalled on GitHub's Ubuntu runners.
        run: shellcheck deploy/*.sh scripts/*.sh

      - name: Validate staging Compose file
        run: |
          API_IMAGE=example/api WEB_IMAGE=example/web \
            docker compose -f deploy/docker-compose.staging.yml config --quiet

      - name: Dependency vulnerability scan (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Docker Compose smoke test
        run: npm run test:compose

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Terraform initialize
        working-directory: infrastructure/terraform/environments/staging
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infrastructure/terraform/environments/staging
        run: terraform validate
